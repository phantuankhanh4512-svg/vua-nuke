<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>nuke panel</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --acc:#f44; --bg:#0a0a0a; --pnl:#111; --brd:#222; --txt:#ddd; --dim:#888; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--txt); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; margin:0; padding:24px; }
  h1 { color:var(--acc); font-size:16px; letter-spacing:4px; margin:0 0 20px; }
  .wrap { max-width:600px; margin:0 auto; }
  .panel { background:var(--pnl); border:1px solid var(--brd); padding:16px; }
  label { display:block; margin:10px 0 4px; font-size:11px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; }
  input, select { width:100%; background:#0d0d0d; border:1px solid #2a2a2a; color:var(--txt); padding:8px; font-family:inherit; font-size:13px; }
  input:focus, select:focus { outline:none; border-color:var(--acc); }
  button { margin-top:18px; width:100%; background:var(--acc); color:#000; border:0; padding:14px; font-weight:bold; letter-spacing:3px; cursor:pointer; font-family:inherit; font-size:13px; }
  button:hover { background:#f66; }
  button:disabled { background:#333; color:#666; cursor:not-allowed; }
  .stat { font-size:11px; color:var(--dim); margin-top:8px; }
</style>
</head>
<body>
<h1>// NUKE BOT</h1>
<div class="wrap">
  <div class="panel">
    <label>token (bot)</label>
    <input id="token" type="password" autocomplete="off" placeholder="MTA... / bot token">
    
    <button id="go">BẬT BOT</button>
    <div class="stat" id="stat">sẵn sàng</div>
    
    <p style="font-size:12px;color:#888;margin-top:20px;line-height:1.6;">
      Hướng dẫn:<br>
      1. Bật bot bằng token.<br>
      2. Thêm bot vào server muốn nuke.<br>
      3. Gõ <b>!nuke</b> vào bất kỳ kênh chat nào trong server đó.<br>
      4. Bot tự động nuke server đó ngay lập tức.
    </p>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const statEl = $('stat');

$('go').onclick = async () => {
  const btn = $('go');
  btn.disabled = true;
  statEl.textContent = 'đang kết nối...';
  const token = $('token').value.trim();
  
  if (!token) {
    statEl.textContent = 'lỗi: cần token';
    btn.disabled = false;
    return;
  }

  try {
    const r = await fetch('/api/bot-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token })
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'lỗi kết nối');
    
    statEl.textContent = 'online: ' + j.user;
    statEl.style.color = '#4c4';
    $('token').value = '';
  } catch (e) {
    statEl.textContent = 'lỗi: ' + e.message;
    statEl.style.color = '#f44';
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>nuke panel</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --acc:#f44; --bg:#0a0a0a; --pnl:#111; --brd:#222; --txt:#ddd; --dim:#888; --grn:#4c4; --ylw:#fa0; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--txt); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; margin:0; padding:24px; }
  h1 { color:var(--acc); font-size:16px; letter-spacing:4px; margin:0 0 20px; text-align:center; }
  .wrap { max-width:600px; margin:0 auto; }
  .panel { background:var(--pnl); border:1px solid var(--brd); padding:16px; margin-bottom:16px; }
  label { display:block; margin:10px 0 4px; font-size:11px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; }
  input { width:100%; background:#0d0d0d; border:1px solid #2a2a2a; color:var(--txt); padding:10px; font-family:inherit; font-size:13px; }
  input:focus { outline:none; border-color:var(--acc); }
  button { width:100%; background:var(--acc); color:#000; border:0; padding:14px; font-weight:bold; letter-spacing:2px; cursor:pointer; font-family:inherit; font-size:13px; margin-top:12px; }
  button:hover { background:#f66; }
  button:disabled { background:#333; color:#666; cursor:not-allowed; }
  .btn-outline { background:transparent; border:1px solid var(--acc); color:var(--acc); }
  .btn-outline:hover { background:rgba(255,68,68,0.1); }
  .btn-add { background:#5865F2; color:#fff; text-decoration:none; display:block; text-align:center; margin-top:12px; padding:12px; font-weight:bold; border-radius:4px; }
  .btn-add:hover { background:#4752C4; }
  .btn-off { background:#333; color:#fff; }
  .btn-off:hover { background:#444; }
  
  #logBox { background:#080808; border:1px solid var(--brd); padding:12px; height:300px; overflow-y:auto; font-size:12px; line-height:1.5; }
  .log-item { margin-bottom:4px; }
  .log-time { color:#666; margin-right:8px; }
  .log-info { color:#ddd; }
  .log-success { color:var(--grn); }
  .log-warn { color:var(--ylw); }
  .log-error { color:var(--acc); }
  
  .hidden { display:none !important; }
  .flex-row { display:flex; gap:8px; }
  .flex-row > * { flex:1; }
</style>
</head>
<body>
<h1>// NUKE BOT</h1>
<div class="wrap">
  
  <!-- TRẠNG THÁI BAN ĐẦU: CHỈ CÓ TOKEN -->
  <div class="panel" id="loginPanel">
    <label>Nhập Token Bot</label>
    <input id="token" type="password" placeholder="MTA...">
    <button id="btnLogin">BẬT BOT</button>
    <div id="loginStat" style="font-size:12px; color:var(--acc); text-align:center; margin-top:8px;"></div>
  </div>

  <!-- KHI ĐÃ ONLINE -->
  <div class="panel hidden" id="controlPanel">
    <div style="text-align:center; font-size:13px; margin-bottom:12px;">
      Trạng thái: <b id="botTag" style="color:var(--grn)"></b>
    </div>
    
    <div class="flex-row">
      <a href="#" id="btnAdd" target="_blank" class="btn-add">ADD BOT VÀO SERVER</a>
      <button id="btnLogout" class="btn-off">TẮT BOT</button>
    </div>

    <p style="font-size:12px; color:#888; margin-top:16px; text-align:center; line-height:1.6;">
      Hướng dẫn: Thêm bot vào server -> Gõ <b style="color:var(--txt)">!nuke</b> vào bất kỳ kênh chat.
    </p>
  </div>

  <!-- LOG CONSOLE -->
  <div class="panel" style="padding:0; border:none;">
    <div id="logBox"></div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
const tokenInput = $('token');
const loginPanel = $('loginPanel');
const controlPanel = $('controlPanel');
const logBox = $('logBox');

// --- QUẢN LÝ UI ---
function setOnlineUI(isOnline, user = '', clientId = '') {
  if (isOnline) {
    loginPanel.classList.add('hidden');
    controlPanel.classList.remove('hidden');
    $('botTag').textContent = user;
    
    // Tạo link add bot
    const permissions = 8; // Admin
    const scope = 'bot%20applications.commands';
    $('btnAdd').href = `https://discord.com/oauth2/authorize?client_id=${clientId}&permissions=${permissions}&scope=${scope}`;
    
    // Lưu token để lần sau F5 còn biết
    localStorage.setItem('nuke_token', tokenInput.value);
  } else {
    loginPanel.classList.remove('hidden');
    controlPanel.classList.add('hidden');
    $('botTag').textContent = '';
    $('btnAdd').href = '#';
    localStorage.removeItem('nuke_token');
    tokenInput.value = '';
  }
}

function renderLogs(logs) {
  logBox.innerHTML = '';
  logs.forEach(l => {
    const div = document.createElement('div');
    div.className = 'log-item';
    div.innerHTML = `<span class="log-time">[${l.time}]</span><span class="log-${l.type}">${l.msg}</span>`;
    logBox.appendChild(div);
  });
  logBox.scrollTop = logBox.scrollHeight;
}

// --- POLL LOG ---
setInterval(async () => {
  try {
    const r = await fetch('/api/logs');
    const logs = await r.json();
    renderLogs(logs);
  } catch (e) {}
}, 1500);

// --- CHECK STATUS KHI MỞ TRANG ---
async function checkStatus() {
  try {
    const r = await fetch('/api/status');
    const j = await r.json();
    if (j.online) {
      setOnlineUI(true, j.user, j.clientId);
    } else {
      const savedToken = localStorage.getItem('nuke_token');
      if (savedToken) tokenInput.value = savedToken;
      setOnlineUI(false);
    }
  } catch (e) {}
}
checkStatus();

// --- ACTION: BẬT BOT ---
$('btnLogin').onclick = async () => {
  const btn = $('btnLogin');
  const token = tokenInput.value.trim();
  const stat = $('loginStat');
  
  if (!token) {
    stat.textContent = 'Vui lòng nhập token!';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'ĐANG KẾT NỐI...';
  stat.textContent = '';

  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token })
    });
    const j = await r.json();
    
    if (!j.ok) throw new Error(j.error || 'Lỗi kết nối');
    
    setOnlineUI(true, j.user, j.clientId);
  } catch (e) {
    stat.textContent = 'Lỗi: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'BẬT BOT';
  }
};

// --- ACTION: TẮT BOT ---
$('btnLogout').onclick = async () => {
  const btn = $('btnLogout');
  btn.disabled = true;
  try {
    await fetch('/api/logout', { method: 'POST' });
    setOnlineUI(false);
  } catch (e) {
    alert('Lỗi tắt bot');
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
